name: FreeBSD build & test

# Native FreeBSD amd64 build + test, run inside a real FreeBSD VM on a Linux runner via
# vmactions/freebsd-vm (FreeBSD binaries need the FreeBSD kernel ABI, so a Linux container can't do
# it and dockcross has no BSD target). CMake auto-derives the platform id "FreeBSD-amd64" from the
# JVM's os.name/os.arch, so only -DJAVA_JDK is needed.
# Manual-only:  gh workflow run freebsd.yml --ref freebsd-amd64
on:
  workflow_dispatch:

jobs:
  freebsd-amd64:
    name: FreeBSD 14 amd64 build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # For the second test column (AllPlatforms autodetection). Downloaded on the runner; the VM
      # receives the whole workspace.
      - name: Download the AllPlatforms jar (CI fixture prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p allplatforms && cd allplatforms
          gh release download ci-allplatforms-fixture -R "$GITHUB_REPOSITORY" -p '*AllPlatforms.zip'
          unzip -q *AllPlatforms.zip

      - name: Build + test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          copyback: true
          prepare: |
            pkg install -y cmake openjdk8
          run: |
            set -eux
            uname -a; freebsd-version
            export JAVA_HOME=/usr/local/openjdk8
            "$JAVA_HOME/bin/java" -version
            mkdir build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DJAVA_JDK="$JAVA_HOME"
            make -j"$(sysctl -n hw.ncpu)"
            echo "== built native lib =="
            file jbinding-cpp/lib7-Zip-JBinding.so
            # Both test columns record their result instead of aborting the VM step: a failing step skips
            # copyback, which would lose the built zip too (the job is failed below, after the upload).
            echo "== ctest =="
            set +e; ctest --output-on-failure; echo $? > ../ctest-rc-perplatform; set -e
            echo "== package =="
            make package
            ls -l sevenzipjbinding-*-FreeBSD-amd64.zip
            echo "== AllPlatforms autodetection: full suite with ONLY the AllPlatforms jar =="
            APJAR="$(find "$PWD/../allplatforms" -name 'sevenzipjbinding-AllPlatforms.jar' | head -1)"
            test -n "$APJAR"
            sed -i '' -E "s#[^:\"]*/sevenzipjbinding-FreeBSD-amd64\.jar#${APJAR}#g" JUnitRunner.cmake
            grep -q 'sevenzipjbinding-AllPlatforms\.jar' JUnitRunner.cmake
            ! grep -q 'sevenzipjbinding-FreeBSD-amd64\.jar' JUnitRunner.cmake
            set +e; ctest --output-on-failure; echo $? > ../ctest-rc-allplatforms; set -e

      - name: Upload FreeBSD-amd64 zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: build/sevenzipjbinding-*-FreeBSD-amd64.zip
          if-no-files-found: warn

      - name: Fail if a test column failed
        run: |
          rc_pp="$(cat ctest-rc-perplatform 2>/dev/null || echo missing)"
          rc_ap="$(cat ctest-rc-allplatforms 2>/dev/null || echo missing)"
          echo "per-platform jar ctest: $rc_pp   AllPlatforms jar ctest: $rc_ap"
          test "$rc_pp" = 0 && test "$rc_ap" = 0

  # Prove SevenZip.getPlatformBestMatch() selects the right native on FreeBSD in BOTH modes:
  #   * native FreeBSD JVM (os.name=FreeBSD)  -> FreeBSD-amd64
  #   * Linux JVM under the Linuxulator (os.name=Linux) -> Linux-amd64
  # We give it a platforms list containing BOTH ids and check which one each JVM picks.
  autodetect:
    name: autodetect (native FreeBSD vs Linuxulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD VM — build API jar + probe under both JVMs
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y cmake openjdk8 wget
            # Linux ABI layer (Linuxulator) + a glibc Linux userland for the Linux-JVM test
            sysrc linux_enable=YES
            service linux start || true
            pkg install -y linux_base-rl9 || true
          run: |
            set -eux
            export JAVA_HOME=/usr/local/openjdk8
            mkdir build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DJAVA_JDK="$JAVA_HOME"
            make sevenzipjbinding-jar
            API="$(find "$PWD" -name sevenzipjbinding.jar | head -1)"; test -n "$API"
            # platforms list with BOTH Linux-amd64 and FreeBSD-amd64 (selection only; no native load)
            mkdir fix
            printf 'platform.1=Linux-amd64\nplatform.2=FreeBSD-amd64\n' > fix/sevenzipjbinding-platforms.properties
            ( cd fix && jar cf ../fixture.jar sevenzipjbinding-platforms.properties )
            CP="$API:$PWD/fixture.jar"
            cat > Probe.java <<'EOF'
            public class Probe { public static void main(String[] a) throws Exception {
              System.out.println("os.name=" + System.getProperty("os.name"));
              System.out.println("os.arch=" + System.getProperty("os.arch"));
              System.out.println("BEST=" + net.sf.sevenzipjbinding.SevenZip.getPlatformBestMatch());
            }}
            EOF
            "$JAVA_HOME/bin/javac" -cp "$CP" Probe.java

            echo "===== NATIVE FreeBSD JVM ====="
            "$JAVA_HOME/bin/java" -cp "$CP:$PWD" Probe | tee out.native
            grep -qx 'os.name=FreeBSD' out.native
            grep -qx 'BEST=FreeBSD-amd64' out.native

            echo "===== LINUX JVM under the Linuxulator ====="
            wget -q -O ljdk.tgz "https://api.adoptium.net/v3/binary/latest/8/ga/linux/x64/jdk/hotspot/normal/eclipse"
            mkdir ljdk && tar xzf ljdk.tgz -C ljdk --strip-components=1
            file ljdk/bin/java
            ./ljdk/bin/java -version 2>&1 | head -1 || true
            ./ljdk/bin/java -cp "$CP:$PWD" Probe | tee out.linux
            grep -qx 'os.name=Linux' out.linux
            grep -qx 'BEST=Linux-amd64' out.linux

            echo "===== AUTODETECT OK: FreeBSD JVM->FreeBSD-amd64, Linux(Linuxulator)->Linux-amd64 ====="
