name: FreeBSD build & test

# Native FreeBSD amd64 build + test, run inside a real FreeBSD VM on a Linux runner via
# vmactions/freebsd-vm (FreeBSD binaries need the FreeBSD kernel ABI, so a Linux container can't do
# it and dockcross has no BSD target). CMake auto-derives the platform id "FreeBSD-amd64" from the
# JVM's os.name/os.arch, so only -DJAVA_JDK is needed.
# Manual-only:  gh workflow run freebsd.yml --ref freebsd-amd64
on:
  workflow_dispatch:

jobs:
  freebsd-amd64:
    name: FreeBSD 14 amd64 build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          copyback: true
          prepare: |
            pkg install -y cmake openjdk8
          run: |
            set -eux
            uname -a; freebsd-version
            export JAVA_HOME=/usr/local/openjdk8
            "$JAVA_HOME/bin/java" -version
            mkdir build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DJAVA_JDK="$JAVA_HOME"
            make -j"$(sysctl -n hw.ncpu)"
            echo "== built native lib =="
            file jbinding-cpp/lib7-Zip-JBinding.so
            echo "== ctest =="
            ctest --output-on-failure
            echo "== package =="
            make package
            ls -l sevenzipjbinding-*-FreeBSD-amd64.zip

      - name: Upload FreeBSD-amd64 zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: build/sevenzipjbinding-*-FreeBSD-amd64.zip
          if-no-files-found: warn
