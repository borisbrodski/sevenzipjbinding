name: macOS build & test

# Build THREE macOS platform artifacts on macos-14 (Apple Silicon):
#   * AllMac      - one universal (fat: x86_64 + arm64) dylib for every 64-bit Mac. Goes into the
#                   AllPlatforms bundle; getPlatformBestMatch() picks it as the Mac universal.
#   * Mac-x86_64  - thin Intel-only dylib (customers shipping one arch avoid the other slice).
#   * Mac-arm64   - thin Apple-Silicon-only dylib.
# Each thin lib is tested on its own architecture; the universal is tested on BOTH (arm64 native +
# x86_64 under Rosetta 2 -> proves the one fat binary works on both). One matrix leg per test arch.
#
# Everything runs on macos-14 because GitHub's Intel macos-13 runners are the only Intel label and are
# heavily queue-constrained.
# Manual-only (workflow_dispatch): trigger from the Actions tab or:
#   gh workflow run macos.yml --ref master
on:
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (${{ matrix.test_arch }} JVM)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { test_arch: arm64,  jdk_arch: aarch64, rosetta: false, upload_universal: true  }  # native
          - { test_arch: x86_64, jdk_arch: x64,     rosetta: true,  upload_universal: false }  # via Rosetta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2 (x86_64 test only)
        if: matrix.rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up JDK 8 (${{ matrix.jdk_arch }}, needs javah)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: ${{ matrix.jdk_arch }}

      - name: Toolchain info
        run: |
          uname -a; sw_vers || true
          clang --version | head -1
          cmake --version | head -1
          echo "JAVA_HOME=$JAVA_HOME"; file "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/javac" -version; ls "$JAVA_HOME/bin/javah"

      - name: Pin CMake 3.x (project predates CMake 4 / CMP0175)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.6'

      # --- Universal (AllMac): one fat dylib with both slices ---
      - name: Configure + build universal AllMac dylib (x86_64 + arm64)
        run: |
          set -eux
          mkdir build-allmac && cd build-allmac
          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_SYSTEM_NAME=Darwin -DAPPLE=TRUE -DSTATIC_BUILD=FALSE \
            -DJAVA_SYSTEM=Mac "-DJAVA_ARCH=x86_64;arm64" \
            -DCMAKE_BUILD_TYPE=Release -DJAVA_JDK="$JAVA_HOME"
          make
          make package
          echo "== built =="; ls -1 sevenzipjbinding-*-AllMac.zip
          file jbinding-cpp/lib7-Zip-JBinding.dylib

      - name: Verify AllMac dylib is universal (both arches present)
        run: |
          set -eux
          lipo -info build-allmac/jbinding-cpp/lib7-Zip-JBinding.dylib
          lipo -archs build-allmac/jbinding-cpp/lib7-Zip-JBinding.dylib | grep -qw x86_64
          lipo -archs build-allmac/jbinding-cpp/lib7-Zip-JBinding.dylib | grep -qw arm64

      - name: Test AllMac with the ${{ matrix.test_arch }} JVM (loads its slice)
        run: cd build-allmac && ctest --output-on-failure

      # --- Thin (this arch only): Mac-x86_64 or Mac-arm64 ---
      - name: Configure + build thin Mac-${{ matrix.test_arch }} dylib
        run: |
          set -eux
          mkdir build-thin && cd build-thin
          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_SYSTEM_NAME=Darwin -DAPPLE=TRUE -DSTATIC_BUILD=FALSE \
            -DJAVA_SYSTEM=Mac "-DJAVA_ARCH=${{ matrix.test_arch }}" \
            -DCMAKE_BUILD_TYPE=Release -DJAVA_JDK="$JAVA_HOME"
          make
          make package
          echo "== built =="; ls -1 sevenzipjbinding-*-Mac-${{ matrix.test_arch }}.zip

      - name: Verify thin dylib is single-arch (${{ matrix.test_arch }} only)
        run: |
          set -eux
          lipo -info build-thin/jbinding-cpp/lib7-Zip-JBinding.dylib
          test "$(lipo -archs build-thin/jbinding-cpp/lib7-Zip-JBinding.dylib | tr -d ' ')" = "${{ matrix.test_arch }}"

      - name: Test thin Mac-${{ matrix.test_arch }} with the ${{ matrix.test_arch }} JVM
        run: cd build-thin && ctest --output-on-failure

      # --- Upload: universal from the arm64 leg only; each leg uploads its own thin ---
      - name: Upload AllMac (universal) zip
        if: always() && matrix.upload_universal
        uses: actions/upload-artifact@v4
        with:
          name: all-mac
          path: build-allmac/sevenzipjbinding-*-AllMac.zip
          if-no-files-found: warn

      - name: Upload thin Mac-${{ matrix.test_arch }} zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.test_arch }}
          path: build-thin/sevenzipjbinding-*-Mac-${{ matrix.test_arch }}.zip
          if-no-files-found: warn

  # -----------------------------------------------------------------------------------------------
  # AllPlatforms autodetection test: prove the single cross-platform AllPlatforms jar (all platform
  # libs incl. the universal AllMac fat dylib) autodetects + loads the Mac lib on BOTH Mac
  # architectures (arm64 native + x86_64 via Rosetta). Runs the full ctest suite with ONLY the
  # AllPlatforms jar on the classpath. The AllPlatforms jar is built locally and published as the
  # 'ci-allplatforms-fixture' prerelease (it needs Linux/Windows/ARM natives not produced in CI).
  allplatforms-autodetect:
    name: AllPlatforms autodetect + test (${{ matrix.test_arch }} JVM)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { test_arch: arm64,  jdk_arch: aarch64, rosetta: false }
          - { test_arch: x86_64, jdk_arch: x64,     rosetta: true  }
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2 (x86_64 test only)
        if: matrix.rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up JDK 8 (${{ matrix.jdk_arch }})
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: ${{ matrix.jdk_arch }}

      - name: Pin CMake 3.x (project predates CMake 4 / CMP0175)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.6'

      - name: Download the AllPlatforms jar (CI fixture prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p allplatforms && cd allplatforms
          gh release download ci-allplatforms-fixture -R "$GITHUB_REPOSITORY" -p '*AllPlatforms.zip'
          unzip -q *AllPlatforms.zip
          find "$PWD" -name 'sevenzipjbinding-AllPlatforms.jar'

      - name: Configure + build the test harness (universal AllMac; its lib is unused here)
        run: |
          set -eux
          mkdir build && cd build
          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_SYSTEM_NAME=Darwin -DAPPLE=TRUE -DSTATIC_BUILD=FALSE \
            -DJAVA_SYSTEM=Mac "-DJAVA_ARCH=x86_64;arm64" \
            -DCMAKE_BUILD_TYPE=Release -DJAVA_JDK="$JAVA_HOME"
          make

      - name: Swap the native jar -> AllPlatforms (force autodetection)
        run: |
          set -eux
          APJAR="$(find "$PWD/allplatforms" -name 'sevenzipjbinding-AllPlatforms.jar' | head -1)"
          test -n "$APJAR"
          # the harness build is the universal AllMac -> its native jar is sevenzipjbinding-AllMac.jar
          sed -i.bak -E "s#[^:\"]*/sevenzipjbinding-AllMac\.jar#${APJAR}#g" build/JUnitRunner.cmake
          echo "== runner classpath now references: =="
          grep -o "sevenzipjbinding-[A-Za-z0-9]*\.jar" build/JUnitRunner.cmake | sort -u

      - name: Run full suite via AllPlatforms autodetection (${{ matrix.test_arch }} JVM)
        run: cd build && ctest --output-on-failure
